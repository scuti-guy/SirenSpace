<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SirenSpace</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <div class="site-title">
            SirenSpace
        </div>

        <div class="account-area">

            <span id="accountInfo"></span>

            <button
                id="loginButton"
                onclick="showLogin()"
            >
                Login
            </button>

            <button
                id="signupButton"
                onclick="showSignup()"
            >
                Sign Up
            </button>

            <button
                id="logoutButton"
                onclick="logout()"
                style="display:none;"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="site-navigation">

        <button
            id="postsTab"
            class="nav-tab active"
            onclick="switchPage('postsPage')"
        >
            Posts
        </button>

        <button
            id="mediaTab"
            class="nav-tab"
            onclick="switchPage('mediaPage')"
        >
            Media
        </button>

    </nav>


    <!-- =========================
         POSTS PAGE
    ========================== -->

    <main
        id="postsPage"
        class="page active"
    >

        <div class="page-top-bar">

            <input
                id="postSearch"
                class="page-search"
                type="text"
                placeholder="Search posts..."
            >

            <button
                class="page-action-button post-message-button"
                onclick="openCreatePost()"
            >
                Post Message
            </button>

        </div>

        <div
            id="postsContainer"
            class="posts-container"
        ></div>

    </main>


    <!-- =========================
         MEDIA PAGE
    ========================== -->

    <main
        id="mediaPage"
        class="page"
    >

        <div class="page-top-bar">

            <input
                id="mediaSearch"
                class="page-search"
                type="text"
                placeholder="Search media..."
            >

            <button
                class="page-action-button media-upload-button"
                onclick="openMediaUpload()"
            >
                Upload
            </button>

        </div>

        <div
            id="mediaContainer"
            class="media-container"
        ></div>

    </main>


    <!-- =========================
         CREATE POST MODAL
    ========================== -->

    <div
        id="createPostModal"
        class="modal"
        style="display:none;"
    >

        <div class="modal-content">

            <button
                class="modal-close"
                onclick="closeCreatePost()"
            >
                ×
            </button>

            <h2>
                Post Message
            </h2>

            <textarea
                id="postContent"
                placeholder="Write something..."
            ></textarea>

            <label for="postFile">
                Upload media
            </label>

            <input
                id="postFile"
                type="file"
                accept="image/*,video/*,audio/*"
                onchange="handlePostFile(event)"
            >

            <div
                id="selectedPostFile"
                class="selected-file"
            ></div>

            <div
                id="postError"
                class="form-error"
            ></div>

            <button
                class="modal-submit-button"
                onclick="createPost()"
            >
                Send
            </button>

        </div>

    </div>


    <!-- =========================
         MEDIA UPLOAD MODAL
    ========================== -->

    <div
        id="mediaUploadModal"
        class="modal"
        style="display:none;"
    >

        <div class="modal-content">

            <button
                class="modal-close"
                onclick="closeMediaUpload()"
            >
                ×
            </button>

            <h2>
                Upload Video
            </h2>

            <label for="mediaTitle">
                Title
            </label>

            <input
                id="mediaTitle"
                type="text"
                placeholder="Video title"
            >

            <label for="mediaDescription">
                Description
            </label>

            <textarea
                id="mediaDescription"
                placeholder="Video description..."
            ></textarea>

            <label for="mediaVideo">
                Video
            </label>

            <input
                id="mediaVideo"
                type="file"
                accept=".mp4,.mov,.avi"
                onchange="handleMediaVideo(event)"
            >

            <div
                id="selectedVideo"
                class="selected-file"
            ></div>

            <label for="mediaThumbnail">
                Thumbnail
            </label>

            <input
                id="mediaThumbnail"
                type="file"
                accept=".png,.jpg,.jpeg,.webp"
                onchange="handleMediaThumbnail(event)"
            >

            <div
                id="selectedThumbnail"
                class="selected-file"
            ></div>

            <div
                id="mediaUploadError"
                class="form-error"
            ></div>

            <button
                class="modal-submit-button"
                onclick="uploadMedia()"
            >
                Upload
            </button>

        </div>

    </div>


    <!-- =========================
         VIDEO VIEWER
    ========================== -->

    <div
        id="videoViewer"
        class="video-viewer"
        style="display:none;"
    >

        <button
            class="video-exit-button"
            onclick="closeVideoViewer()"
        >
            Exit
        </button>

        <div class="youtube-player">

            <div class="youtube-video-wrapper">

                <video
                    id="mainVideoPlayer"
                    playsinline
                ></video>

                <div
                    id="videoBigPlay"
                    class="video-big-play"
                >
                    ▶
                </div>

                <div class="youtube-controls">

                    <div
                        id="videoProgressContainer"
                        class="video-progress-container"
                    >
                        <div
                            id="videoProgress"
                            class="video-progress"
                        ></div>
                    </div>

                    <div class="youtube-control-row">

                        <button
                            id="playPauseButton"
                            class="player-button"
                        >
                            ▶
                        </button>

                        <span
                            id="videoTime"
                            class="video-time"
                        >
                            0:00 / 0:00
                        </span>

                        <div class="volume-container">

                            <button
                                id="muteButton"
                                class="player-button"
                            >
                                🔊
                            </button>

                            <input
                                id="volumeSlider"
                                class="volume-slider"
                                type="range"
                                min="0"
                                max="1"
                                step="0.01"
                                value="1"
                            >

                        </div>

                        <button
                            id="speedButton"
                            class="player-button"
                        >
                            1x
                        </button>

                        <button
                            id="fullscreenButton"
                            class="player-button"
                        >
                            ⛶
                        </button>

                    </div>

                </div>

            </div>

            <h2
                id="viewerTitle"
                class="viewer-title"
            ></h2>

            <div class="video-buttons">

                <button id="likeButton">
                    Like 0
                </button>

                <button id="dislikeButton">
                    Dislike 0
                </button>

                <span id="viewCount">
                    Views: 0
                </span>

            </div>

            <div class="viewer-uploader">

                <img
                    id="viewerPoster"
                    alt=""
                >

            </div>

            <p
                id="viewerDescription"
                class="viewer-description"
            ></p>

        </div>

    </div>


    <!-- =========================
         ACCOUNT MODAL
    ========================== -->

    <div
        id="accountModal"
        class="modal"
        style="display:none;"
    >

        <div class="modal-content">

            <button
                class="modal-close"
                onclick="closeAccount()"
            >
                ×
            </button>


            <!-- LOGIN -->

            <div id="loginForm">

                <h2>
                    Login
                </h2>

                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Username"
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                >

                <div
                    id="loginError"
                    class="form-error"
                ></div>

                <button
                    class="modal-submit-button"
                    onclick="login()"
                >
                    Login
                </button>

                <p>
                    Don't have an account?

                    <button
                        class="text-button"
                        onclick="showSignup()"
                    >
                        Sign Up
                    </button>
                </p>

            </div>


            <!-- SIGN UP -->

            <div
                id="signupForm"
                style="display:none;"
            >

                <h2>
                    Sign Up
                </h2>

                <input
                    id="signupUsername"
                    type="text"
                    placeholder="Username"
                >

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="Password"
                >

                <input
                    id="signupPasswordConfirm"
                    type="password"
                    placeholder="Confirm password"
                >

                <div
                    id="signupError"
                    class="form-error"
                ></div>

                <button
                    class="modal-submit-button"
                    onclick="signup()"
                >
                    Sign Up
                </button>

                <p>
                    Already have an account?

                    <button
                        class="text-button"
                        onclick="showLogin()"
                    >
                        Login
                    </button>
                </p>

            </div>

        </div>

    </div>


    <!-- =========================
         SCRIPTS
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="app.js"></script>

    <script src="media.js"></script>

</body>
</html>
