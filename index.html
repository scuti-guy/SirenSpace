<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SirenSpace</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <div class="site-title">
            SirenSpace
        </div>

        <div class="account-area">

            <button
                id="loginButton"
                onclick="showLogin()"
            >
                Login
            </button>

            <button
                id="signupButton"
                onclick="showSignup()"
            >
                Sign Up
            </button>

            <span
                id="accountInfo"
                style="display: none;"
            ></span>

            <button
                id="logoutButton"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- NAVIGATION -->

    <nav class="site-navigation">

        <button
            class="nav-tab active"
            data-page="posts"
            onclick="switchPage('posts')"
        >
            Posts
        </button>

        <button
            class="nav-tab"
            data-page="media"
            onclick="switchPage('media')"
        >
            Media
        </button>

    </nav>


    <!-- MAIN CONTENT -->

    <main class="site-main">


        <!-- POSTS PAGE -->

        <section
            id="postsPage"
            class="page active"
            data-page="posts"
        >

            <div class="page-top-bar">

                <input
                    type="text"
                    class="page-search"
                    placeholder="Search posts..."
                >

                <button
                    class="page-action-button post-message-button"
                    onclick="openCreatePost()"
                >
                    Post Message
                </button>

            </div>

            <div id="postsContainer"></div>

        </section>


        <!-- MEDIA PAGE -->

        <section
            id="mediaPage"
            class="page"
            data-page="media"
        >

            <div class="page-top-bar">

                <input
                    type="text"
                    class="page-search"
                    placeholder="Search media..."
                >

                <button
                    class="page-action-button media-upload-button"
                    onclick="openMediaUpload()"
                >
                    Upload
                </button>

            </div>

            <div
                id="mediaContainer"
                class="media-container"
            ></div>

        </section>

    </main>


    <!-- CREATE POST MODAL -->

    <div
        id="createPostModal"
        class="modal"
    >

        <div class="modal-content">

            <button
                class="close-button"
                onclick="closeCreatePost()"
            >
                ×
            </button>

            <h2>Post Message</h2>

            <textarea
                id="postContent"
                placeholder="What's on your mind?"
            ></textarea>

            <input
                type="file"
                id="postFile"
                accept="image/*,video/*,audio/*"
                onchange="handlePostFile(this)"
            >

            <div
                id="selectedFile"
                class="selected-file"
            ></div>

            <div
                id="postError"
                class="error-message"
            ></div>

            <button
                class="post-submit-button"
                onclick="createPost()"
            >
                Send
            </button>

        </div>

    </div>


    <!-- MEDIA UPLOAD MODAL -->

    <div
        id="mediaUploadModal"
        class="modal"
    >

        <div class="modal-content">

            <button
                class="close-button"
                onclick="closeMediaUpload()"
            >
                ×
            </button>

            <h2>Upload Video</h2>

            <input
                type="text"
                id="mediaTitle"
                placeholder="Video title"
                maxlength="100"
            >

            <textarea
                id="mediaDescription"
                placeholder="Description"
                maxlength="2000"
            ></textarea>

            <label>
                Video
            </label>

            <input
                type="file"
                id="mediaVideo"
                accept=".mp4,.mov,.avi"
                onchange="handleMediaVideo(this)"
            >

            <div
                id="selectedVideo"
                class="selected-file"
            ></div>

            <label>
                Thumbnail
            </label>

            <input
                type="file"
                id="mediaThumbnail"
                accept=".png,.jpg,.jpeg,.webp"
                onchange="handleMediaThumbnail(this)"
            >

            <div
                id="selectedThumbnail"
                class="selected-file"
            ></div>

            <div
                id="mediaUploadError"
                class="error-message"
            ></div>

            <button
                class="post-submit-button"
                onclick="uploadMedia()"
            >
                Upload
            </button>

        </div>

    </div>


    <!-- ACCOUNT MODAL -->

    <div
        id="accountModal"
        class="modal"
    >

        <div class="modal-content">

            <button
                class="close-button"
                onclick="closeAccount()"
            >
                ×
            </button>


            <!-- LOGIN -->

            <div id="loginForm">

                <h2>Login</h2>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Username"
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                >

                <div
                    id="accountError"
                    class="error-message"
                ></div>

                <button
                    class="post-submit-button"
                    onclick="login()"
                >
                    Login
                </button>

                <p>
                    Don't have an account?
                    <button
                        class="text-button"
                        onclick="showSignup()"
                    >
                        Sign Up
                    </button>
                </p>

            </div>


            <!-- SIGN UP -->

            <div
                id="signupForm"
                style="display: none;"
            >

                <h2>Sign Up</h2>

                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Username"
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                >

                <div
                    id="accountError"
                    class="error-message"
                ></div>

                <button
                    class="post-submit-button"
                    onclick="signup()"
                >
                    Sign Up
                </button>

                <p>
                    Already have an account?
                    <button
                        class="text-button"
                        onclick="showLogin()"
                    >
                        Login
                    </button>
                </p>

            </div>

        </div>

    </div>


    <!-- SCRIPTS -->

    <script src="supabase.js"></script>
    <script src="posts.js"></script>
    <script src="media.js"></script>
    <script src="app.js"></script>

</body>
</html>
