<!DOCTYPE html>
<html>
<head>
    <title>SirenSpace</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #1b1b1b;
            padding: 20px;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;

            font-family: "Franklin Gothic Medium", Arial, sans-serif;
            font-size: 36px;

            background: linear-gradient(
                135deg,
                #650000 0%,
                #ff7777 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .post {
            background: #1b1b1b;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>SirenSpace</h1>
</header>

<main>

    <div class="post">
        <h2>Welcome to SirenSpace!</h2>
        <p>A community for siren enthusiasts.</p>
    </div>

    <div class="post">
        <h2>Example Post</h2>
        <p>This is where community posts will eventually appear.</p>
    </div>

</main>

</body>
</html>
