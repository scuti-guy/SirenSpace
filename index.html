<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SirenSpace</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #1b1b1b;
            border-bottom: 1px solid #333;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;
            font-family: "Franklin Gothic Medium", Arial, sans-serif;
            font-size: 30px;
            background: linear-gradient(90deg, #8b0000, #ff4f8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .account-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .account-buttons button {
            background: #650000;
            color: white;
            border: none;
            padding: 9px 13px;
            border-radius: 5px;
            cursor: pointer;
        }

        .account-buttons button:hover {
            background: #8a0000;
        }

        .account-username {
            color: #ff7777;
            margin-right: 5px;
        }

        main {
            width: 700px;
            max-width: calc(100% - 30px);
            margin: 25px auto;
        }

        .create-post-button {
            width: 100%;
            background: #1677ff;
            color: white;
            border: none;
            padding: 12px 16px;
            margin-bottom: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        .create-post-button:hover {
            background: #0f63d6;
        }

        .post {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }

        .post-user {
            color: #ff7777;
            font-weight: bold;
            word-break: break-word;
        }

        .post-date {
            color: #777;
            font-size: 12px;
            white-space: nowrap;
        }

        .post-content {
            color: #eee;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .post-media {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 6px;
        }

        .post-image {
            display: block;
            max-width: 100%;
            max-height: 600px;
            object-fit: contain;
        }

        .post-video {
            display: block;
            width: 100%;
            max-height: 600px;
        }

        .post-audio {
            width: 100%;
        }

        .post-actions {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: flex-end;
        }

        .delete-button {
            background: #650000;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .delete-button:hover {
            background: #8a0000;
        }

        .no-posts {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            color: #888;
        }

        .loading-posts {
            color: #888;
            text-align: center;
            padding: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            overflow-y: auto;
        }

        .modal-content {
            background: #1b1b1b;
            width: 350px;
            max-width: calc(100% - 40px);
            margin: 120px auto;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #333;
            position: relative;
        }

        .modal-content h2 {
            margin-top: 0;
            font-family: "Franklin Gothic Medium", Arial, sans-serif;
        }

        .modal-content input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-bottom: 10px;
            background: #111;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
        }

        .modal-content button:not(.close-button) {
            width: 100%;
            padding: 11px;
            background: #650000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal-content button:not(.close-button):hover {
            background: #8a0000;
        }

        .modal-content a {
            color: #ff7777;
        }

        .close-button {
            position: absolute;
            right: 15px;
            top: 10px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }

        .message {
            color: #ff7777;
        }

        .post-modal-content {
            width: 500px;
            max-width: calc(100% - 40px);
        }

        .post-modal-content textarea {
            width: 100%;
            min-height: 130px;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 12px;
            background: #111;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            resize: vertical;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .upload-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-bottom: 10px;
            background: #333;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }

        .upload-button:hover {
            background: #444;
        }

        .selected-file {
            display: none;
            background: #111;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            color: #ccc;
            word-break: break-word;
        }

        .post-error {
            color: #ff7777;
            margin: 8px 0;
            font-size: 14px;
        }

        .post-submit-button {
            width: 100%;
            padding: 11px;
            background: #1677ff !important;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .post-submit-button:hover {
            background: #0f63d6 !important;
        }

    </style>

</head>

<body>

<header>

    <h1>SirenSpace</h1>

    <div class="account-buttons" id="accountButtons">

        <button onclick="showLogin()">Log In</button>

        <button onclick="showSignup()">Sign Up</button>

    </div>

</header>


<main>

    <button
        class="create-post-button"
        onclick="openCreatePost()"
    >
        Create Post
    </button>

    <div id="postsContainer">

        <div class="loading-posts">
            Loading posts...
        </div>

    </div>

</main>


<!-- CREATE POST MODAL -->

<div id="createPostModal" class="modal">

    <div class="modal-content post-modal-content">

        <button
            class="close-button"
            onclick="closeCreatePost()"
        >
            ×
        </button>

        <h2>Create Post</h2>

        <textarea
            id="postText"
            placeholder="What do you want to share?"
            maxlength="5000"
        ></textarea>

        <label
            class="upload-button"
            for="postFile"
        >
            Upload
        </label>

        <input
            id="postFile"
            type="file"
            accept="image/*,video/*,audio/*"
            style="display: none;"
            onchange="handlePostFile(this)"
        >

        <div
            id="selectedFile"
            class="selected-file"
        ></div>

        <p
            id="postMessage"
            class="post-error"
        ></p>

        <button
            class="post-submit-button"
            onclick="createPost()"
        >
            Post
        </button>

    </div>

</div>


<!-- ACCOUNT MODAL -->

<div id="accountModal" class="modal">

    <div class="modal-content">

        <button
            class="close-button"
            onclick="closeAccount()"
        >
            ×
        </button>


        <!-- LOGIN -->

        <div id="loginForm">

            <h2>Log In</h2>

            <input
                id="loginUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button onclick="login()">
                Log In
            </button>

            <p>
                Don't have an account?
                <a
                    href="#"
                    onclick="showSignup(); return false;"
                >
                    Sign Up
                </a>
            </p>

            <p
                id="loginMessage"
                class="message"
            ></p>

        </div>


        <!-- SIGN UP -->

        <div
            id="signupForm"
            style="display: none;"
        >

            <h2>Create Account</h2>

            <input
                id="signupUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
                maxlength="30"
            >

            <input
                id="signupPassword"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
            >

            <button onclick="signup()">
                Sign Up
            </button>

            <p>
                Already have an account?
                <a
                    href="#"
                    onclick="showLogin(); return false;"
                >
                    Log In
                </a>
            </p>

            <p
                id="signupMessage"
                class="message"
            ></p>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://uwxtpiwrmecdgabyicpa.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_YKUIrkT58Ecsp-Hl_5OBVg_BKpMEbDd";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================
    // SECURITY
    // ==========================================

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    // ==========================================
    // ACCOUNT MODAL
    // ==========================================

    function showLogin() {

        document.getElementById("accountModal").style.display =
            "block";

        document.getElementById("loginForm").style.display =
            "block";

        document.getElementById("signupForm").style.display =
            "none";

        document.getElementById("loginMessage").textContent =
            "";

        document.getElementById("signupMessage").textContent =
            "";

    }


    function showSignup() {

        document.getElementById("accountModal").style.display =
            "block";

        document.getElementById("loginForm").style.display =
            "none";

        document.getElementById("signupForm").style.display =
            "block";

        document.getElementById("loginMessage").textContent =
            "";

        document.getElementById("signupMessage").textContent =
            "";

    }


    function closeAccount() {

        document.getElementById("accountModal").style.display =
            "none";

    }


    // ==========================================
    // SIGN UP
    // ==========================================

    async function signup() {

        const username =
            document.getElementById("signupUsername")
            .value
            .trim();

        const password =
            document.getElementById("signupPassword")
            .value;

        const message =
            document.getElementById("signupMessage");


        if (!username || !password) {

            message.textContent =
                "Please enter a username and password.";

            return;

        }


        if (username.length < 3) {

            message.textContent =
                "Username must be at least 3 characters.";

            return;

        }


        if (password.length < 6) {

            message.textContent =
                "Password must be at least 6 characters.";

            return;

        }


        if (!/^[a-zA-Z0-9_]+$/.test(username)) {

            message.textContent =
                "Username can only contain letters, numbers, and underscores.";

            return;

        }


        message.textContent =
            "Creating account...";


        const internalEmail =
            username.toLowerCase() +
            "@accounts.sirenspace.local";


        const { data, error } =
            await supabaseClient.auth.signUp({

                email: internalEmail,

                password: password,

                options: {

                    data: {
                        username: username
                    }

                }

            });


        if (error) {

            message.textContent =
                error.message;

            return;

        }


        if (!data.user) {

            message.textContent =
                "Something went wrong creating the account.";

            return;

        }


        message.textContent =
            "Account created!";


        document.getElementById("signupUsername").value =
            "";

        document.getElementById("signupPassword").value =
            "";


        await loadAccount();


        setTimeout(function() {

            closeAccount();

        }, 700);

    }


    // ==========================================
    // LOG IN
    // ==========================================

    async function login() {

        const username =
            document.getElementById("loginUsername")
            .value
            .trim();

        const password =
            document.getElementById("loginPassword")
            .value;

        const message =
            document.getElementById("loginMessage");


        if (!username || !password) {

            message.textContent =
                "Please enter a username and password.";

            return;

        }


        message.textContent =
            "Logging in...";


        const internalEmail =
            username.toLowerCase() +
            "@accounts.sirenspace.local";


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: internalEmail,

                password: password

            });


        if (error) {

            message.textContent =
                error.message;

            return;

        }


        document.getElementById("loginUsername").value =
            "";

        document.getElementById("loginPassword").value =
            "";


        await loadAccount();

        await loadPosts();

        closeAccount();

    }


    // ==========================================
    // LOAD ACCOUNT
    // ==========================================

    async function loadAccount() {

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();


        const accountButtons =
            document.getElementById("accountButtons");


        if (!user) {

            accountButtons.innerHTML = `

                <button onclick="showLogin()">
                    Log In
                </button>

                <button onclick="showSignup()">
                    Sign Up
                </button>

            `;

            return;

        }


        const {
            data: profile,
            error
        } = await supabaseClient

            .from("profiles")

            .select("username")

            .eq("id", user.id)

            .single();


        if (error || !profile) {

            accountButtons.innerHTML = `

                <button onclick="logout()">
                    Log Out
                </button>

            `;

            return;

        }


        accountButtons.innerHTML = `

            <span class="account-username">
                ${escapeHTML(profile.username)}
            </span>

            <button onclick="logout()">
                Log Out
            </button>

        `;

    }


    // ==========================================
    // LOG OUT
    // ==========================================

    async function logout() {

        const {
            error
        } = await supabaseClient.auth.signOut();


        if (error) {

            alert(error.message);

            return;

        }


        await loadAccount();

        await loadPosts();

    }


    // ==========================================
    // CREATE POST MODAL
    // ==========================================

    function openCreatePost() {

        supabaseClient.auth.getUser()
            .then(function(result) {

                if (!result.data.user) {

                    showLogin();

                    document.getElementById("loginMessage").textContent =
                        "You must be logged in to create a post.";

                    return;

                }


                document.getElementById("createPostModal").style.display =
                    "block";

                document.getElementById("postMessage").textContent =
                    "";

            });

    }


    function closeCreatePost() {

        document.getElementById("createPostModal").style.display =
            "none";

        document.getElementById("postText").value =
            "";

        document.getElementById("postFile").value =
            "";

        const selectedFile =
            document.getElementById("selectedFile");

        selectedFile.textContent =
            "";

        selectedFile.style.display =
            "none";

        document.getElementById("postMessage").textContent =
            "";

    }


    function handlePostFile(input) {

        const selectedFile =
            document.getElementById("selectedFile");


        if (!input.files || !input.files[0]) {

            selectedFile.textContent =
                "";

            selectedFile.style.display =
                "none";

            return;

        }


        const file =
            input.files[0];


        const allowedTypes = [

            "image/",
            "video/",
            "audio/"

        ];


        const validType =
            allowedTypes.some(function(type) {

                return file.type.startsWith(type);

            });


        if (!validType) {

            input.value =
                "";

            selectedFile.textContent =
                "";

            selectedFile.style.display =
                "none";

            document.getElementById("postMessage").textContent =
                "Only image, video, and audio files can be uploaded.";

            return;

        }


        selectedFile.textContent =
            "Selected: " + file.name;

        selectedFile.style.display =
            "block";

        document.getElementById("postMessage").textContent =
            "";

    }


    // ==========================================
    // CREATE POST
    // ==========================================

    async function createPost() {

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();


        if (!user) {

            closeCreatePost();

            showLogin();

            document.getElementById("loginMessage").textContent =
                "You must be logged in to create a post.";

            return;

        }


        const text =
            document.getElementById("postText")
            .value
            .trim();


        const fileInput =
            document.getElementById("postFile");


        const file =
            fileInput.files[0];


        const message =
            document.getElementById("postMessage");


        if (!text && !file) {

            message.textContent =
                "Add some text or upload a file before posting.";

            return;

        }


        message.textContent =
            "Creating post...";


        let mediaURL = null;
        let mediaType = null;


        // ==========================================
        // UPLOAD MEDIA
        // ==========================================

        if (file) {

            const extension =
                file.name.includes(".")
                    ? "." + file.name.split(".").pop().toLowerCase()
                    : "";


            const filePath =
                user.id +
                "/" +
                crypto.randomUUID() +
                extension;


            const {
                error: uploadError
            } = await supabaseClient.storage

                .from("post-media")

                .upload(
                    filePath,
                    file
                );


            if (uploadError) {

                message.textContent =
                    "Upload failed: " +
                    uploadError.message;

                return;

            }


            const {
                data: publicURLData
            } = supabaseClient.storage

                .from("post-media")

                .getPublicUrl(filePath);


            mediaURL =
                publicURLData.publicUrl;

            mediaType =
                file.type;

        }


        // ==========================================
        // GET USERNAME
        // ==========================================

        const {
            data: profile,
            error: profileError
        } = await supabaseClient

            .from("profiles")

            .select("username")

            .eq("id", user.id)

            .single();


        if (profileError || !profile) {

            message.textContent =
                "Could not find your profile.";

            return;

        }


        // ==========================================
        // SAVE POST
        // ==========================================

        const {
            error: postError
        } = await supabaseClient

            .from("posts")

            .insert({

                user_id: user.id,

                username: profile.username,

                content: text || null,

                media_url: mediaURL,

                media_type: mediaType

            });


        if (postError) {

            message.textContent =
                "Could not create post: " +
                postError.message;

            return;

        }


        closeCreatePost();

        await loadPosts();

    }


    // ==========================================
    // LOAD POSTS
    // ==========================================

    async function loadPosts() {

        const container =
            document.getElementById("postsContainer");


        container.innerHTML = `

            <div class="loading-posts">
                Loading posts...
            </div>

        `;


        const {
            data: posts,
            error
        } = await supabaseClient

            .from("posts")

            .select("*")

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            container.innerHTML = `

                <div class="no-posts">
                    Could not load posts.
                </div>

            `;

            console.error(error);

            return;

        }


        if (!posts || posts.length === 0) {

            container.innerHTML = `

                <div class="no-posts">
                    No posts yet.
                </div>

            `;

            return;

        }


        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();


        container.innerHTML =
            "";


        posts.forEach(function(post) {

            const postElement =
                document.createElement("div");

            postElement.className =
                "post";


            // ==========================================
            // POST HEADER
            // ==========================================

            const header =
                document.createElement("div");

            header.className =
                "post-header";


            const username =
                document.createElement("div");

            username.className =
                "post-user";

            username.textContent =
                post.username;


            const date =
                document.createElement("div");

            date.className =
                "post-date";


            const postDate =
                new Date(post.created_at);


            date.textContent =
                postDate.toLocaleString();


            header.appendChild(username);

            header.appendChild(date);

            postElement.appendChild(header);


            // ==========================================
            // TEXT
            // ==========================================

            if (post.content) {

                const content =
                    document.createElement("div");

                content.className =
                    "post-content";

                content.textContent =
                    post.content;

                postElement.appendChild(content);

            }


            // ==========================================
            // MEDIA
            // ==========================================

            if (
                post.media_url &&
                post.media_type
            ) {

                const mediaContainer =
                    document.createElement("div");

                mediaContainer.className =
                    "post-media";


                if (
                    post.media_type.startsWith("image/")
                ) {

                    const image =
                        document.createElement("img");

                    image.className =
                        "post-image";

                    image.src =
                        post.media_url;

                    image.alt =
                        "Post image";

                    image.loading =
                        "lazy";

                    mediaContainer.appendChild(image);

                }


                else if (
                    post.media_type.startsWith("video/")
                ) {

                    const video =
                        document.createElement("video");

                    video.className =
                        "post-video";

                    video.controls =
                        true;

                    video.src =
                        post.media_url;

                    mediaContainer.appendChild(video);

                }


                else if (
                    post.media_type.startsWith("audio/")
                ) {

                    const audio =
                        document.createElement("audio");

                    audio.className =
                        "post-audio";

                    audio.controls =
                        true;

                    audio.src =
                        post.media_url;

                    mediaContainer.appendChild(audio);

                }


                postElement.appendChild(mediaContainer);

            }


            // ==========================================
            // DELETE BUTTON
            // ==========================================

            if (
                user &&
                user.id === post.user_id
            ) {

                const actions =
                    document.createElement("div");

                actions.className =
                    "post-actions";


                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete-button";

                deleteButton.textContent =
                    "Delete";


                deleteButton.onclick =
                    function() {

                        deletePost(post.id);

                    };


                actions.appendChild(deleteButton);

                postElement.appendChild(actions);

            }


            container.appendChild(postElement);

        });

    }


    // ==========================================
    // DELETE POST
    // ==========================================

    async function deletePost(postId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this post?"
            );


        if (!confirmed) {

            return;

        }


        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();


        if (!user) {

            alert(
                "You must be logged in to delete a post."
            );

            return;

        }


        const {
            error
        } = await supabaseClient

            .from("posts")

            .delete()

            .eq("id", postId)

            .eq("user_id", user.id);


        if (error) {

            alert(
                "Could not delete post: " +
                error.message
            );

            return;

        }


        await loadPosts();

    }


    // ==========================================
    // CLOSE MODALS WHEN CLICKING OUTSIDE
    // ==========================================

    window.onclick =
        function(event) {

            const accountModal =
                document.getElementById("accountModal");

            const createPostModal =
                document.getElementById("createPostModal");


            if (
                event.target === accountModal
            ) {

                closeAccount();

            }


            if (
                event.target === createPostModal
            ) {

                closeCreatePost();

            }

        };


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadAccount();

    loadPosts();


    // ==========================================
    // AUTH STATE CHANGES
    // ==========================================

    supabaseClient.auth.onAuthStateChange(

        function(event, session) {

            loadAccount();

            loadPosts();

        }

    );

</script>

</body>

</html>
